<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Пати Квиз</title>
    
    <!-- Подключение статического TailwindCSS v2.2.19 (без JS-рантайма, 100% совместимо со Smart TV webOS и Safari) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    
    <!-- Обязательное подключение внешней таблицы стилей -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Подключение библиотеки для QR-кода -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" crossorigin="anonymous"></script>
    
    <!-- Подключение стабильных UMD-сборок React 18, ReactDOM 18 и Babel Standalone -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-900 text-white overflow-hidden m-0 p-0">
    <!-- Корневой контейнер приложения -->
    <div id="root" class="app-bg h-screen w-screen font-sans overflow-hidden"></div>

    <!-- Подключение скриптов в строгом порядке -->
    <script src="questions.js"></script>
    <script src="sync.js"></script>
    <script type="text/babel" src="app.js"></script>
</body>
</html>
