<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Пати Квиз</title>
    
    <!-- Неблокирующее подключение шрифтов Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&family=Nunito:wght@700;900&display=swap" rel="stylesheet">

    <!-- Статический TailwindCSS v2.2.19 (100% совместимо со Smart TV webOS и мобильными устройствами) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    
    <!-- Основная внешняя таблица стилей -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Кроссбраузерный патч разметки -->
    <style>
        .inset-0 { top: 0 !important; right: 0 !important; bottom: 0 !important; left: 0 !important; }
        .shrink-0 { -webkit-flex-shrink: 0 !important; flex-shrink: 0 !important; }
        .pawn-wrapper { position: relative !important; width: 100% !important; height: 100% !important; }
        
        .tv-modal-overlay {
            position: relative;
            z-index: 20;
            flex: 1 1 0%;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
            padding: 1rem;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .categories-grid-6 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-gap: 0.75rem;
            gap: 0.75rem;
            width: 100%;
        }

        .board-grid {
            display: grid !important;
            grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
            grid-template-rows: repeat(5, minmax(0, 1fr)) !important;
            grid-gap: 0.5rem !important;
            gap: 0.5rem !important;
            padding: 0.75rem !important;
            box-sizing: border-box !important;
        }

        .mobile-container {
            min-height: 100vh;
            min-height: 100dvh;
            height: 100%;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* Цвета Tailwind v3 для v2 */
        .bg-black\/85 { background-color: rgba(0, 0, 0, 0.85) !important; }
        .bg-black\/75 { background-color: rgba(0, 0, 0, 0.75) !important; }
        .bg-black\/50 { background-color: rgba(0, 0, 0, 0.5) !important; }
        .bg-black\/40 { background-color: rgba(0, 0, 0, 0.4) !important; }
        .bg-black\/30 { background-color: rgba(0, 0, 0, 0.3) !important; }
        .bg-white\/20 { background-color: rgba(255, 255, 255, 0.2) !important; }
        .hover\:bg-white\/30:hover { background-color: rgba(255, 255, 255, 0.3) !important; }
        .bg-indigo-900\/60 { background-color: rgba(49, 46, 129, 0.6) !important; }
        .bg-indigo-900\/70 { background-color: rgba(49, 46, 129, 0.7) !important; }
        .bg-indigo-900\/80 { background-color: rgba(49, 46, 129, 0.8) !important; }
        .text-yellow-300 { color: #fde047 !important; }
        .text-yellow-200 { color: #fef08a !important; }
        .text-yellow-100 { color: #fef9c3 !important; }
        .bg-yellow-300 { background-color: #fde047 !important; }
        .bg-yellow-400 { background-color: #facc15 !important; }
        .bg-lime-400 { background-color: #a3e635 !important; }
        .bg-amber-400 { background-color: #fbbf24 !important; }
        .bg-amber-600 { background-color: #d97706 !important; }
        .bg-slate-300 { background-color: #cbd5e1 !important; }
        .bg-emerald-500 { background-color: #10b981 !important; }
        .border-3 { border-width: 3px !important; }

        .flex.gap-1\.5 > * + * { margin-left: 0.375rem; }
        .flex.gap-2 > * + * { margin-left: 0.5rem; }
        .flex.gap-3 > * + * { margin-left: 0.75rem; }
        .flex.gap-4 > * + * { margin-left: 1rem; }
        .flex-col.gap-2 > * + * { margin-left: 0 !important; margin-top: 0.5rem; }

        /* Фоллбэки для церемонии награждения топ-3 */
        .winner-podium-overlay {
            position: fixed !important;
            top: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            left: 0 !important;
            z-index: 50 !important;
            display: -webkit-flex !important;
            display: flex !important;
            -webkit-align-items: center !important;
            align-items: center !important;
            -webkit-justify-content: center !important;
            justify-content: center !important;
            background-color: rgba(0, 0, 0, 0.9) !important;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 1rem !important;
            box-sizing: border-box !important;
        }
        .podium-card {
            width: 90vw;
            max-width: 900px;
            height: 85vh;
            border-radius: 24px;
            box-sizing: border-box;
            background: #312e81;
        }
        .podium-gold {
            border: 6px solid #FFD700 !important;
            box-shadow: 0 0 50px #FFD700, inset 0 0 20px #FFD700 !important;
        }
        .podium-silver {
            border: 6px solid #CBD5E1 !important;
            box-shadow: 0 0 50px #CBD5E1, inset 0 0 20px #94A3B8 !important;
        }
        .podium-bronze {
            border: 6px solid #CD7F32 !important;
            box-shadow: 0 0 50px #CD7F32, inset 0 0 20px #78350F !important;
        }
    </style>
    
    <!-- Подключение библиотеки для QR-кода -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" crossorigin="anonymous"></script>
    
    <!-- Подключение React 18 UMD (чистый ES5-рантайм для Smart TV и мобильных) -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

    <!-- Подключение Babel Standalone CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body class="bg-gray-900 text-white overflow-x-hidden m-0 p-0">
    <!-- Корневой контейнер приложения -->
    <div id="root" class="app-bg min-h-screen w-screen font-sans overflow-x-hidden"></div>

    <!-- Подключение скриптов в строгом порядке -->
    <script src="questions.js"></script>
    <script src="sync.js"></script>
    <script type="text/babel" src="app.js"></script>
</body>
</html>
